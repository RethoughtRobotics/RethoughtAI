---
# pi0.5 (PaliGemma 3B + Gemma 300M action expert) from lerobot/pi05_base, with the LoRA layout of
# openpi's pi05 LoRA configs (gemma_2b_lora + gemma_300m_lora), as used in saifahmadgit/openpi_franka:
#   SigLIP vision encoder + projector   fully trained
#   Gemma 2B language decoder           frozen, LoRA r=16 alpha=16 on attention + MLP
#   Gemma 300M action expert            frozen, LoRA r=32 alpha=32 on attention + MLP
#   action / time projections           fully trained
# Reproduces pi05_BlueCupToContainer (2026-10-13). See README.md for the measured cost.
name: pi05
backend: lerobot
dataset: blue_cup_to_container_46ep
steps: 60000
batch_size: 32
save_freq: 5000
log_freq: 50
gpu_mem_mib: 34000  # batch 32 measured at 30.5 GB
retry_batch_sizes: [16, 8]
upload_steps: [20000, 40000, 60000]
precheck:  # the PaliGemma tokenizer is gated on Hugging Face
  cmd: python -c "from transformers import AutoTokenizer; AutoTokenizer.from_pretrained('google/paligemma-3b-pt-224')"
  hint: accept the license at https://huggingface.co/google/paligemma-3b-pt-224 with the account that owns your HF token
args:
  policy.type: pi05
  policy.pretrained_path: lerobot/pi05_base
  policy.dtype: bfloat16
  policy.gradient_checkpointing: true  # required: gradients reach every VLM layer through LoRA
  policy.chunk_size: 16
  policy.n_action_steps: 16
  policy.scheduler_decay_steps: 60000  # cosine over the whole run (default 30k)
  peft.target_modules: .*\.(language_model|gemma_expert\.model)\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)
  peft.full_training_modules: [vision_tower, multi_modal_projector, action_in_proj, action_out_proj, time_mlp_in, time_mlp_out]
  peft.r: 16
  peft.lora_alpha: 16
  peft.rank_pattern: {.*gemma_expert.*: 32}
  peft.alpha_pattern: {.*gemma_expert.*: 32}
