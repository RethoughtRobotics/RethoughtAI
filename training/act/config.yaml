---
# ACT (Action Chunking Transformer), trained from scratch. Reproduces act_cup_chunk20 (2026-10-08).
name: act
backend: task
dataset: cup_to_container  # ACT looks at the raw images, so full resolution
steps: 100000
batch_size: 8
save_freq: 10000
gpu_mem_mib: 12000  # rough estimate, not measured; small model
retry_batch_sizes: []
args:
  policy_type: act
  chunk_size: 20
