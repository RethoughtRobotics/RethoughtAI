[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rai"
version = "0.1.0"
description = "RethoughtAI: record demonstrations, convert to LeRobot v3, deploy policies"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "click",
    "rerun-sdk",
    "opencv-python-headless",
    "pillow",
    "scipy",
    "forge-robotics",
    "huggingface-hub",
    "lerobot[dataset,smolvla,multi-task-dit,groot]>=0.6.1",
    "torch",
    "torchvision",
]

[project.scripts]
record    = "recorder.cli:main"
adapt     = "adapter.cli:main"
inference = "inference.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/recorder/recorder",
    "src/adapter/adapter",
    "src/inference/inference",
]

# CUDA 12.8 torch: runs on NVIDIA driver >= 525; PyPI's CUDA 13 build needs >= 580
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
