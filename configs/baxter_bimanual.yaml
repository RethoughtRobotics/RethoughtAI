---
# Pose-only SweepTrash deployment. Start teleop with --both --policy --no-gripper.
robot: baxter
topics:
  images:
    - {topic: /cameras/left_hand_camera/image, key: observation.images.left}
    - {topic: /cameras/right_hand_camera/image, key: observation.images.right}
    - {topic: /cameras/third_eye/color/image_raw, key: observation.images.third_eye}
trigger:
  light:
    topic: /robot/digital_io/command
    msg_type: baxter_core_msgs/DigitalOutputCommand
    name: left_inner_light
inference:
  arm: both
  fps: 25
  publish_rate: 100
  max_tcp_skew: 0.1
  joint_states: /robot/joint_states
  chunk: /policy/both/chunk
  engage: /policy/both/engage
  engaged: /policy/both/engaged
  home: /vive/right/b_button
  entry_ramp: 1.0
  chunk_size: 32
  task: Sweep the trash into the dustpan and empty it into the bin  # only if a checkpoint's dataset tasks are unreadable
  arms:
    left:
      tcp: /teleop/left/tcp
      target: /policy/left/target
      path: /policy/left/path  # timed plan per step, for the teleop's --input trajectory (feedforward)
      trigger: /policy/left/trigger  # interface only: no gripper commands published
      home: /vive/right/b_button
      cuff: /robot/digital_io/left_lower_cuff/state
    right:
      tcp: /teleop/right/tcp
      target: /policy/right/target
      path: /policy/right/path  # timed plan per step, for the teleop's --input trajectory (feedforward)
      trigger: /policy/right/trigger
      home: /vive/left/b_button
      cuff: /robot/digital_io/right_lower_cuff/state
  deadman:
    topic: /libsurvive/joy
    frame_id: LHR-12D31191
    button: 17
    alive: /vive/right/target
  policies:
    vita_bimanual:
      every: 16
      merge: {type: latest}
      overrides: {n_action_steps: 32}
      # Already trained with lead_steps=1: no extra offset or relative RTC.
    smolvla_bimanual:
      # SweepTrash SmolVLA: plans of 50 from one observation, replanned as VITA. Absolute poses: no RTC.
      every: 16
      merge: {type: latest}
      overrides: {num_steps: 10}
    multi_task_dit_bimanual:
      # SweepTrash DiTs: as the cup DiT's multi_task_dit_absolute (a plan every 4 frames, temporally
      # ensembled), without a gripper, the plans weighted nearly evenly (ACT's exp(-0.01 i), i = 0 the
      # oldest): their small strokes disagree from plan to plan, and an even average cancels more of
      # that than one favouring the newest. A _lead<N>ms dataset already leads its labels, so no
      # run-time lead is added.
      every: 4
      merge: {type: ensemble, coeff: 0.01}
      overrides: {num_inference_steps: 10, n_action_steps: 31}  # 31: its plan starts at the older of its 2 observations
      # inpaint: each chunk continues the one playing (inference/inpaint.py), for the teleop's plan input
      inpaint: false
