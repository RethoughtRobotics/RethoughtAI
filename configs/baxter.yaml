robot: baxter

topics:
  images:
    - topic: /cameras/left_hand_camera/image
      key: observation.images.left
    - topic: /cameras/right_hand_camera/image
      key: observation.images.right
    - topic: /cameras/third_eye/color/image_raw
      key: observation.images.third_eye
  state:
    - topic: /robot/joint_states
      key: observation.state
  extra:
    # Teleop (bringbackbaxter): measured TCP (state, delta anchor), the goal its servo chases
    # (action labels; only while clutched), and its settings incl. the measured tcp_offset.
    - /teleop/left/tcp
    - /teleop/left/goal
    - /teleop/left/config
    - /teleop/right/tcp
    - /teleop/right/goal
    - /teleop/right/config
    - /robot/end_effector/left_gripper/state
    - /robot/end_effector/left_gripper/command
    - /robot/end_effector/right_gripper/state
    - /robot/end_effector/right_gripper/command
    # Joint-space actions: the velocity command that reached the arm, and the teleop's IK
    # (position: q, velocity: IK qdot, effort: qdot sent) and TCP twist.
    - /robot/limb/left/joint_command
    - /robot/limb/right/joint_command
    - /teleop/left/ik
    - /teleop/right/ik
    - /teleop/left/tcp_twist
    - /teleop/right/tcp_twist
    # Contact and load: SEA commanded vs actual position/velocity/effort and gravity model,
    # Baxter's endpoint pose/twist/wrench estimate, collision detection.
    - /robot/limb/left/gravity_compensation_torques
    - /robot/limb/right/gravity_compensation_torques
    - /robot/limb/left/endpoint_state
    - /robot/limb/right/endpoint_state
    - /robot/limb/left/collision_detection_state
    - /robot/limb/right/collision_detection_state
    # Kinesthetic: the cuff squeezed (arm guided by hand, zero-g) and its gripper buttons (dash
    # closes, circle opens: the teleop's cuff control; their commands are on .../gripper/command).
    - /robot/digital_io/left_lower_cuff/state
    - /robot/digital_io/right_lower_cuff/state
    - /robot/digital_io/left_upper_button/state
    - /robot/digital_io/left_lower_button/state
    - /robot/digital_io/right_upper_button/state
    - /robot/digital_io/right_lower_button/state
    # Mode/safety overrides: distinguish cuff presses from whether guidance was allowed.
    # These are command events, not latched proof of the controller's current safety state.
    - /robot/limb/left/suppress_cuff_interaction
    - /robot/limb/right/suppress_cuff_interaction
    - /robot/limb/left/suppress_collision_avoidance
    - /robot/limb/right/suppress_collision_avoidance
    - /robot/limb/left/suppress_contact_safety
    - /robot/limb/right/suppress_contact_safety
    - /robot/limb/left/suppress_hand_overwrench_safety
    - /robot/limb/right/suppress_hand_overwrench_safety
    - /robot/limb/left/suppress_gravity_compensation
    - /robot/limb/right/suppress_gravity_compensation
    - /robot/limb/left/set_speed_ratio
    - /robot/limb/right/set_speed_ratio
    # Teaching/session events and navigator wheels/buttons.
    - /robot/navigators/left_navigator/state
    - /robot/navigators/right_navigator/state
    - /robot/digital_io/left_button_show/state
    - /robot/digital_io/left_button_ok/state
    - /robot/digital_io/left_button_back/state
    # Explain assembly-state errors and identify the grippers/tools used in a demo.
    - /diagnostics
    - /robot/end_effector/left_gripper/properties
    - /robot/end_effector/right_gripper/properties
    # Hand sensors: IMU, IR range to what is below the gripper.
    - /robot/accelerometer/left_accelerometer/state
    - /robot/accelerometer/right_accelerometer/state
    - /robot/range/left_hand_range/state
    - /robot/range/right_hand_range/state
    # Camera intrinsics, robot frames (for bag viewers; also rebuildable from joints + URDF),
    # robot enable/estop state.
    - /cameras/left_hand_camera/camera_info
    - /cameras/right_hand_camera/camera_info
    - /cameras/third_eye/color/camera_info
    - /tf
    - /tf_static
    - /robot/state
    # inference run (policy runtime): what it sent the teleop
    - /policy/left/target
    - /policy/left/trigger
    - /policy/right/target
    - /policy/right/trigger
  # Operator inputs (libsurvive_ros2), never --excluded: with swap_hands the right controller
  # drives the left arm. Replaying them re-runs the teleop offline.
  operator:
    - /vive/left/target
    - /vive/right/target
    - /vive/left/trigger
    - /vive/right/trigger
    - /vive/left/b_button
    - /vive/right/b_button
    - /vive/left/thumbstick
    - /vive/right/thumbstick
    - /libsurvive/joy
    - /libsurvive/tf          # VR tracking tree, kept off /tf
    - /libsurvive/tf_static

trigger:
  type: digital_io
  msg_type: baxter_core_msgs/DigitalIOState
  state_field: state
  record:  /robot/digital_io/left_button_show/state
  success: /robot/digital_io/left_button_ok/state
  discard: /robot/digital_io/left_button_back/state
  screen: session  # drawn session screens; true for the image screens in assets/
  light:
    topic: /robot/digital_io/command
    msg_type: baxter_core_msgs/DigitalOutputCommand
    name: left_inner_light
  # Both VR thumbsticks (libsurvive_ros2) pushed the same way for `hold` s.
  thumbstick:
    topics: [/vive/left/thumbstick, /vive/right/thumbstick]
    hold: 2.0
    start:   north
    stop:    south
    success: east
    discard: west

recording:
  fps: 30
  # Raw camera names above remain the live inference/viz inputs. The recorder publishes
  # and bags JPEG copies on <topic>/compressed; use raw here for lossless source images.
  image_transport: compressed
  jpeg_quality: 90

# inference: `serve` publishes a policy's chunks; `run` executes them (or a replay) through the
# arm's teleop like its VR controller (bringbackbaxter: run_teleop.sh --left --policy).
inference:
  arm: left
  fps: 25                  # policy steps per second, the dataset rate
  publish_rate: 100        # target stream, Hz
  tcp: /teleop/left/tcp
  target: /policy/left/target
  trigger: /policy/left/trigger
  engage: /policy/left/engage   # std_srvs/SetBool: engage without the deadman (./start, ./stop)
  engaged: /policy/left/engaged # runtime -> policy server: start fresh on every change
  home: /vive/right/b_button    # B: clear the policy, resume fresh (swap_hands: right controller drives left arm)
  cuff: /robot/digital_io/left_lower_cuff/state  # squeezed = correcting by hand (zero-g), any policy
  resume_ramp: 0.3         # s, crossfade into the re-anchored chunk after a correction
  chunk: /policy/left/chunk     # serve -> run
  joint_states: /robot/joint_states
  gripper: /robot/end_effector/left_gripper/state
  task: Pick up the blue cup and place it in the red container   # for VLAs
  deadman:                 # held = run: the trackpad touch of the controller driving this arm
    topic: /libsurvive/joy
    frame_id: LHR-12D31191 # right_serial in libsurvive_ros2 vive_devices.yaml; swap_hands gives it the left arm
    button: 17             # touch bit: SURVIVE_BUTTON_MAX (16) + SURVIVE_BUTTON_TRACKPAD (1)
    alive: /vive/right/target  # released when that controller is no longer tracked
  # Per checkpoint type: inference every `every` steps, chunk merge (runtime.py), optional RTC.
  policies:
    act:
      every: 1
      # held-out, vs the demonstrator's goal: 100 / +0.01 (ACT paper) 95 mm off; 30 / -0.05 65 mm,
      # with 99th-percentile steps 10 -> 16 mm. Newest-favouring, last 1.2 s: reacts sooner.
      merge: {type: ensemble, coeff: -0.05, horizon: 30}
    smolvla:
      every: 10
      merge: {type: latest}
      overrides: {num_steps: 10}  # flow steps; 5 matched 10's held-out error, ~170 ms faster
      # execution_horizon > inference delay in steps (~13 next to the sim), or chunks seam
      rtc: {execution_horizon: 25, max_guidance_weight: 10.0}
    vita:
      # chunks of 16 (of a 32-step plan); ~25 ms on the laptop GPU, so every step, merged as ACT
      every: 1
      merge: {type: ensemble, coeff: -0.05}
    multi_task_dit:
      # chunks of 24 (of a 32-step plan) from the last 2 steps; ~100 ms on the laptop GPU (10 DDPM
      # steps), so every 4 steps, ensembled as VITA. Offline on episode 4 it matches VITA's error.
      every: 4
      merge: {type: ensemble, coeff: -0.05}
    groot:
      # GR00T N1.7 3B: absolute goals in chunks of 16 (no RTC: it continues TCP-relative chunks).
      # Needs a GPU with ~10 GB (bf16); the laptop's 4 GB can't hold it, and on the CPU (fp32) it
      # takes ~6 s a chunk, longer than the 0.64 s chunk lasts. Untuned: every and merge as VITA's.
      every: 4
      merge: {type: ensemble, coeff: -0.05}
  # --replay
  chunk_size: 100
  n_action_steps: 1
  temporal_ensemble_coeff: 0.01
